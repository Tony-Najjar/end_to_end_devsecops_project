stages:
  - test
  - quality
  - security
  - build

variables:
  IMAGE_NAME: "$dockerhub_username/end-to-end-devsecops-project:$CI_PIPELINE_IID"

unit_test:
  stage: test
  tags:
    - sobarqube
  image: node:20-alpine
  script:
    - cd end_to_end_devsecops_project
    - npm install
    - npm test

sonarqube_check:
  stage: quality
  tags:
    - sobarqube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    - echo "Testing SonarQube token"
    - sonar-scanner -Dsonar.token=$SONAR_TOKEN

build_and_push_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:26-dind

  before_script:
    - echo "Docker username length ${#dockerhub_username}"
    - echo "Docker token length ${#dockerhub_token}"
    - echo "$dockerhub_token" | docker login -u "$dockerhub_username" --password-stdin

  script:
    - cd end_to_end_devsecops_project
    - docker build -t "$IMAGE_NAME" .
    - docker push "$IMAGE_NAME"
    - docker images

  needs:
    - sonarqube_check


trivy_scan_image:

  stage: security
  image:
    name: docker.io/aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE_NAME"
  needs: 
   - build_and_push_image

  