stages:
  - test
  - security

unit_test:
  stage: test
  tags:
    - sobarqube
  image: node:20-alpine
  script:
    - cd end_to_end_devsecops_project
    - npm test

sonarqube_check:
  stage: security
  tags:
    - sobarqube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    - echo "Testing SonarQube token"
    - sonar-scanner -Dsonar.token=$SONAR_TOKEN